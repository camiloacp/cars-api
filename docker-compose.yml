services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////data/mlflow.db
      --serve-artifacts
      --artifacts-destination /data/mlartifacts
      --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow:5000"
    ports:
      - "5000:5000"
    volumes:
      - ../mlflow.db:/data/mlflow.db
      - ../mlartifacts:/data/mlartifacts

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
