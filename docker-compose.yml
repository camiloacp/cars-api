services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_URI=/app/model
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      # AGREGA ESTA LÍNEA AQUÍ PARA LA EJECUCIÓN DE LA API
      - MLFLOW_SKOPS_TRUSTED_TYPES=True 
